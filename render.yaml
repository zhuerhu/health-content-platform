# Render 部署描述文件（Blueprint）
# 用法：把本仓库推到 GitHub 后，在 Render 控制台 New → Blueprint，选择该仓库即可一键创建。
services:
  - type: web
    name: health-content-platform
    runtime: node
    plan: free
    branch: main
    buildCommand: npm install
    startCommand: node server.js
    healthCheckPath: /
    envVars:
      # 登录令牌签名密钥，Render 自动生成随机值（改它会让已登录用户需要重新登录）
      - key: SESSION_SECRET
        generateValue: true
      # 初始管理员密码：创建 Blueprint 时由你在 Render 页面填写（用户名固定为 admin）
      - key: ADMIN_PASSWORD
        sync: false
    # 如需「重启/重新部署后数据与视频不丢」，请升级到付费实例并把下面注释打开（挂载持久盘）
    # disks:
    #   - name: content-data
    #     mountPath: /var/data
    #     sizeGB: 1
    # 并在 envVars 里补充： - key: DATA_DIR   value: /var/data
