<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>健康内容中台 · 后台素材管理</title>
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <header class="site-header">
    <div class="wrap">
      <div>
        <h1><span class="logo">⚙️</span> 后台素材管理</h1>
        <p>录入内容素材并打标签，前端即可按标签筛选分发。</p>
      </div>
      <div class="links">
        <a href="index.html">← 返回内容广场</a>
      </div>
    </div>
  </header>

  <div class="admin-wrap">
    <div class="form-card">
      <h2 class="section-title" id="form-title">新增内容素材</h2>
      <form id="content-form">
        <input type="hidden" id="edit-id" />
        <div class="field">
          <label>标题 *</label>
          <input type="text" id="f-title" placeholder="例如：高血压就像水管水压太高" required />
        </div>
        <div class="field">
          <label>内容分类 *</label>
          <select id="f-category" required></select>
        </div>
        <div class="field">
          <label>内容标签（可多选）</label>
          <div class="check-grid" id="f-disease"></div>
        </div>
        <div class="field">
          <label>内容形态标签（可多选）</label>
          <div class="check-grid" id="f-format"></div>
        </div>
        <div class="field">
          <label>用户旅程 / 内容深度（可多选）</label>
          <div class="check-grid" id="f-journey"></div>
        </div>
        <div class="field">
          <label>细分主题（按所选分类对应的子分类，可多选）</label>
          <div class="check-grid" id="f-subtopic"></div>
          <div class="hint" id="subtopic-hint">请先选择上方"内容分类"，再勾选对应的细分主题。</div>
        </div>
        <div class="field">
          <label>摘要</label>
          <textarea id="f-summary" placeholder="一句话说明这篇内容讲什么"></textarea>
        </div>
        <div class="field">
          <label>正文</label>
          <textarea id="f-body" placeholder="详细内容、步骤、要点…支持换行"></textarea>
          <div class="hint">正文支持纯文本换行显示。</div>
        </div>
        <div class="field">
          <label>封面图（可选，≤8MB）</label>
          <input type="file" id="f-cover" accept="image/*" />
          <div class="hint" id="cover-hint">不上传则使用分类占位图。</div>
        </div>
        <div class="field">
          <label>视频 / 链接（可选）</label>
          <input type="text" id="f-video" placeholder="视频地址或外部链接" />
        </div>
        <div style="display:flex; gap:10px;">
          <button type="submit" class="btn btn-primary" id="submit-btn">保存内容</button>
          <button type="button" class="btn" id="cancel-edit" style="display:none;">取消编辑</button>
        </div>
      </form>
    </div>

    <div class="admin-list">
      <h2 class="section-title">已发布内容（<span id="list-count">0</span>）</h2>
      <div id="admin-items"></div>
    </div>
  </div>

  <div class="toast" id="toast"></div>
  <script src="admin.js"></script>
</body>
</html>
