<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="description" content="健康内容中台 · 内容广场：按分类与四维标签筛选健康内容，支持收藏与筛选结果分享。" />
  <title>健康内容中台 · 内容广场</title>
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <header class="site-header">
    <div class="wrap">
      <div class="brand-row">
        <div class="brand">
          <span class="logo">🌿</span>
          <div>
            <h1>健康内容中台</h1>
            <p>内容生产 → 标签化管理 → 千人千面分发</p>
          </div>
        </div>
        <div class="header-actions">
          <button id="edit-toggle" class="ghost-btn" title="进入编辑模式，可直接增删改内容">✏️ 编辑模式</button>
          <button id="fav-toggle" class="ghost-btn" title="只看我收藏的内容">♡ 我的收藏 <b id="fav-count">0</b></button>
          <button id="share-btn" class="ghost-btn" title="复制当前筛选条件的链接">🔗 分享筛选</button>
        </div>
      </div>

      <div class="hero">
        <h2>按标签，找到<em>刚刚好</em>的健康内容</h2>
        <p>6 大内容库 · 四维标签体系（内容标签 / 内容形态 / 用户旅程 / 细分主题），覆盖从认知层到深化层的完整链路。</p>
        <div class="stats" id="stats"></div>
      </div>
    </div>
  </header>

  <div class="container">
    <!-- 分类快捷入口 -->
    <section class="cats" id="cats"></section>

    <!-- 吸顶工具栏 -->
    <div class="toolbar" id="toolbar">
      <div class="search-box">
        <span class="ic">🔍</span>
        <input id="search" type="text" placeholder="搜索标题、摘要、正文或标签…" />
        <span class="kbd">/</span>
      </div>
      <select id="category" class="filter-select">
        <option value="">全部分类</option>
      </select>
      <select id="sort" class="filter-select">
        <option value="new">最新优先</option>
        <option value="old">最早优先</option>
        <option value="title">按标题排序</option>
      </select>
      <button id="reset" class="btn">重置筛选</button>
    </div>

    <!-- 编辑工具条（仅编辑模式可见） -->
    <div class="editbar" id="editbar">
      <span class="eb-tag">✏️ 编辑模式</span>
      <span class="eb-state" id="ed-state"></span>
      <span class="eb-grow"></span>
      <button class="btn btn-primary" id="btn-new">＋ 新建内容</button>
      <button class="btn" id="btn-export">导出 JSON</button>
      <button class="btn" id="btn-import-replace">导入（覆盖）</button>
      <button class="btn" id="btn-import-append">导入（追加）</button>
      <button class="btn danger" id="btn-reset-data">恢复初始</button>
      <input id="import-file" type="file" accept="application/json,.json" hidden />
    </div>

    <!-- 标签筛选区 -->
    <section class="filters">
      <div class="filter-group">
        <div class="label"><b>细分主题</b><span class="tip">（按所选分类自动对应子分类；同组为"或"）</span></div>
        <div class="pills" id="subtopic-pills"></div>
      </div>
      <div class="filter-group">
        <div class="label"><b>内容标签</b><span class="tip">（可多选，同组为"或"）</span></div>
        <div class="pills" id="disease-pills"></div>
      </div>
      <div class="filter-group">
        <div class="label"><b>内容形态</b><span class="tip">（可多选）</span></div>
        <div class="pills" id="format-pills"></div>
      </div>
      <div class="filter-group">
        <div class="label"><b>用户旅程 / 内容深度</b><span class="tip">（认知层 → 行动层 → 深化层）</span></div>
        <div class="pills" id="journey-pills"></div>
      </div>
    </section>

    <!-- 已选条件 -->
    <div class="active-bar" id="active-bar"></div>
    <button class="chip-clear" id="chip-clear" style="display:none;">清除全部</button>

    <div class="result-bar">
      <div class="count">共 <b id="total">0</b> 条内容<span id="range" class="tip"></span></div>
      <div class="ops">
        <div class="seg">
          <button data-view="grid" class="on" title="网格视图">▦ 网格</button>
          <button data-view="list" title="列表视图">☰ 列表</button>
        </div>
      </div>
    </div>

    <div class="grid" id="grid"></div>
    <div class="empty" id="empty" style="display:none;">
      <span class="ic">🍃</span>
      <div class="t">没有符合条件的内容</div>
      <div class="s">试试放宽筛选条件，或者<a href="#" id="empty-reset" style="color:var(--green-dark);text-decoration:underline;">重置全部筛选</a>。</div>
    </div>
  </div>

  <!-- 返回顶部 -->
  <button class="to-top" id="to-top" title="返回顶部">↑</button>

  <!-- 详情弹窗 -->
  <div class="modal-mask" id="modal">
    <div class="modal">
      <div class="modal-head">
        <button id="modal-fav" class="fav" title="收藏">♡</button>
        <button id="modal-edit" title="编辑这条内容" style="display:none;">✎</button>
        <button id="modal-close" title="关闭（Esc）">×</button>
      </div>
      <div class="m-cover" id="m-cover">🌿</div>
      <div class="m-body">
        <h2 class="m-title" id="m-title"></h2>
        <div class="m-time" id="m-time"></div>
        <div class="m-meta" id="m-meta"></div>
        <div class="m-text" id="m-text"></div>
        <div class="m-video" id="m-video"></div>
        <div class="related" id="m-related" style="display:none;">
          <h4>🔗 相关推荐</h4>
          <div class="related-list" id="m-related-list"></div>
        </div>
      </div>
    </div>
  </div>

  <!-- 编辑器弹窗（新建 / 编辑内容，含封面图上传） -->
  <div class="modal-mask" id="editor">
    <div class="modal editor">
      <div class="ed-head">
        <h3 id="ed-head-title">新建内容</h3>
        <button class="ed-x" id="ed-close" title="关闭">×</button>
      </div>
      <div class="ed-body">
        <div class="ed-error" id="ed-error"></div>
        <div class="ed-row">
          <div class="ed-col">
            <div class="field">
              <label>标题 <span class="req">必填</span></label>
              <input id="ed-title" type="text" placeholder="例如：高血压就像水管水压太高" />
            </div>
            <div class="field">
              <label>内容分类 <span class="req">必填</span></label>
              <select id="ed-category"></select>
            </div>
            <div class="field">
              <label>细分主题</label>
              <div class="check-grid" id="ed-subtopic"></div>
            </div>
            <div class="field">
              <label>内容标签</label>
              <div class="check-grid" id="ed-disease"></div>
            </div>
            <div class="field">
              <label>内容形态</label>
              <div class="check-grid" id="ed-format"></div>
            </div>
            <div class="field">
              <label>用户旅程 / 内容深度</label>
              <div class="check-grid" id="ed-journey"></div>
            </div>
            <div class="field">
              <label>摘要</label>
              <textarea id="ed-summary" placeholder="一句话说明这篇内容讲什么"></textarea>
            </div>
            <div class="field">
              <label>正文</label>
              <textarea id="ed-body" placeholder="详细内容、步骤、要点…支持换行"></textarea>
            </div>
            <div class="field">
              <label>视频 / 链接（可选）</label>
              <input id="ed-video" type="text" placeholder="视频地址或外部链接" />
            </div>
          </div>

          <div class="ed-col">
            <div class="field">
              <label>封面图（可选）</label>
              <div class="cover-row">
                <div class="cover-prev" id="ed-cover-prev">🌿</div>
                <div class="cover-ctrl">
                  <div class="cover-btns">
                    <button type="button" class="btn" id="ed-cover-pick">上传图片</button>
                    <button type="button" class="btn" id="ed-cover-clear">清除</button>
                  </div>
                  <span class="hint" id="ed-cover-hint">建议宽度 600px 以上；图片会压缩后存在本机浏览器里</span>
                </div>
              </div>
              <input id="ed-cover-url" type="text" placeholder="或粘贴图片地址 https://…" style="margin-top:8px;" />
              <input id="ed-cover-file" type="file" accept="image/*" hidden />
            </div>
            <div class="field">
              <label>创建日期</label>
              <input id="ed-date" type="date" />
            </div>
          </div>
        </div>

        <div class="ed-actions">
          <span class="eb-grow"></span>
          <button class="btn danger" id="ed-delete" style="display:none;">删除</button>
          <button class="btn" id="ed-cancel">取消</button>
          <button class="btn btn-primary" id="ed-save">保存内容</button>
        </div>
      </div>
    </div>
  </div>

  <div class="toast" id="toast"></div>

  <script src="data.js"></script>
  <script src="app.js"></script>
</body>
</html>
